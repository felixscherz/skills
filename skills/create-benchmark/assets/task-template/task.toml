schema_version = "1.4"
# The candidate's repository, copied into the separate verifier.
artifacts = ["/root/REPO"]

[metadata]
source = "REPOSITORY@BASE_COMMIT, PR or session"

[agent]
timeout_sec = 1800.0

[verifier]
timeout_sec = 900.0
environment_mode = "separate"

[verifier.env]
JUDGE_MODEL = "${JUDGE_MODEL:-deepseek/deepseek-flash}"
DEEPSEEK_API_KEY = "${DEEPSEEK_API_KEY}"

[environment]
build_timeout_sec = 1200.0
cpus = 2
memory_mb = 4096
